[package]
name = "adb-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["process", "time", "rt", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
apk-info = "1.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.4"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
