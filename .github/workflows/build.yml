name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the on-device helper matches its recorded hash
        shell: bash
        run: test "$(sha256sum helper/dist/helper.jar | cut -d' ' -f1)" = "$(tr -d '\r\n' < helper/dist/helper.jar.sha256)"
      - name: Rust unit tests (do not block the build)
        run: cargo test -p adb-core --lib
        continue-on-error: true
      - run: npm ci
        working-directory: ui
      - run: ui/node_modules/.bin/tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: coolant-windows
          path: |
            target/release/bundle/**/*
            target/release/adb-manager.exe
