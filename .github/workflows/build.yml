name: build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix: { os: [windows-latest, macos-latest, ubuntu-22.04] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: ui
      - run: npx tauri build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with:
          name: adb-manager-${{ matrix.os }}
          path: |
            target/release/bundle/**/*
            target/release/adb-manager
            target/release/adb-manager.exe
